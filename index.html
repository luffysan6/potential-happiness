<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Grid</title>
    <style>
      /* ── Reset ── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background: #fafafa;
        padding: 32px 20px;
        color: #262626;
      }

      /* ── Grid ── */
      .ig-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 24px;
        max-width: 1400px;
        margin: 0 auto;
      }

      /* ── Cell wrapper ── */
      .ig-cell {
        position: relative;
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #efefef;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        min-height: 480px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        transition:
          box-shadow 0.25s ease,
          transform 0.25s ease;
      }
      .ig-cell:hover {
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        transform: translateY(-3px);
      }

      /* ── Loading skeleton ── */
      .ig-skeleton {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 20px;
        pointer-events: none;
        z-index: 1;
      }
      .ig-skeleton.hidden {
        display: none;
      }

      .skel-bar {
        border-radius: 8px;
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
      }
      .skel-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .skel-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .skel-lines {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      .skel-line {
        height: 10px;
      }
      .skel-line.w60 {
        width: 60%;
      }
      .skel-line.w40 {
        width: 40%;
      }
      .skel-image {
        flex: 1;
        border-radius: 8px;
        min-height: 300px;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      /* ── Embed blockquote override ── */
      .ig-cell .instagram-media {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        margin: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        border: none !important;
        flex: 1;
        z-index: 2;
        position: relative;
      }

      /* ── Fallback card ── */
      .ig-fallback {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 36px 24px;
        text-align: center;
        width: 100%;
        height: 100%;
        min-height: 480px;
      }
      .ig-fallback.visible {
        display: flex;
      }

      .ig-fallback-icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(
          135deg,
          #f09433,
          #e6683c,
          #dc2743,
          #cc2366,
          #bc1888
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        box-shadow: 0 8px 24px rgba(220, 39, 67, 0.25);
      }
      .ig-fallback h4 {
        font-size: 15px;
        font-weight: 600;
        color: #262626;
      }
      .ig-fallback p {
        font-size: 12px;
        color: #8e8e8e;
        line-height: 1.5;
        max-width: 220px;
      }
      .ig-fallback a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 20px;
        border-radius: 8px;
        background: linear-gradient(135deg, #f09433, #dc2743, #bc1888);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 4px 14px rgba(220, 39, 67, 0.3);
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .ig-fallback a:hover {
        opacity: 0.88;
        transform: scale(1.03);
      }
    </style>
  </head>
  <body>
    <div class="ig-grid" id="igGrid"></div>

    <script>
      /* ═══════════════════════════════════════════════
       CONFIGURATION — swap in your real URLs here
    ═══════════════════════════════════════════════ */
      var IG_URLS = [
        "https://www.instagram.com/reel/DWGH0xfjQl5/?igsh=Ym5xbDEydWwwNGM4",
        "https://www.instagram.com/reel/DVFfApOkw5z/?igsh=cDkzOXA0MGJ5ZnNu",
        "https://www.instagram.com/reel/DVFfApOkw5z/?igsh=cDkzOXA0MGJ5ZnNu",
        "https://www.instagram.com/reel/DVPswWJk-wN/?igsh=OWo1Y3p2aGtnOWc=",
        "https://www.instagram.com/reel/DVPswWJk-wN/?igsh=OWo1Y3p2aGtnOWc=",
        "https://www.instagram.com/reel/DVXhRMgEQME/?igsh=em54Z3Voa3h6MHRk",
        // "https://www.facebook.com/share/r/1DPZsc8nMC/",
        "https://www.instagram.com/reel/DVpfL6wkRjo/?igsh=M3JjMXAzMmRvMWV6",
        "https://www.instagram.com/reel/DVzsi-GEx8o/?igsh=YjZ6eWo2dXkxZWxo",
        "https://www.instagram.com/reel/DV7j-e7kRNM/?igsh=MXIzcWVjaGU1enluNQ==",
      ];

      /* ═══════════════════════════════════════════════
       VALIDATION HELPER
       Returns cleaned URL or null if invalid
    ═══════════════════════════════════════════════ */
      function validateIgUrl(url) {
        var pattern =
          /^https?:\/\/(www\.)?instagram\.com\/(p|reel|tv)\/[\w-]+\/?/;
        if (!url || !pattern.test(url)) return null;
        var clean = url.split("?")[0];
        return clean.endsWith("/") ? clean : clean + "/";
      }

      /* ═══════════════════════════════════════════════
       BUILD CELL
       Creates one grid cell DOM node for a given URL
    ═══════════════════════════════════════════════ */
      function buildCell(url, index) {
        var cleanUrl = validateIgUrl(url);

        var cell = document.createElement("div");
        cell.className = "ig-cell";
        cell.dataset.index = index;

        /* ── Skeleton ── */
        cell.innerHTML = `
        <div class="ig-skeleton" id="skel-${index}">
          <div class="skel-header">
            <div class="skel-bar skel-avatar"></div>
            <div class="skel-lines">
              <div class="skel-bar skel-line w60"></div>
              <div class="skel-bar skel-line w40"></div>
            </div>
          </div>
          <div class="skel-bar skel-image"></div>
        </div>
      `;

        if (!cleanUrl) {
          /* ── Invalid URL → immediate fallback ── */
          showFallback(cell, url || "#");
          cell.querySelector(".ig-skeleton").classList.add("hidden");
        } else {
          /* ── Valid URL → blockquote for oEmbed ── */
          var bq = document.createElement("blockquote");
          bq.className = "instagram-media";
          bq.setAttribute("data-instgrm-captioned", "false");
          bq.setAttribute("data-instgrm-permalink", cleanUrl);
          bq.setAttribute("data-instgrm-version", "14");
          bq.dataset.fallbackUrl = cleanUrl;
          cell.appendChild(bq);
        }

        return cell;
      }

      /* ═══════════════════════════════════════════════
       SHOW FALLBACK
       Injects fallback card into a cell
    ═══════════════════════════════════════════════ */
      function showFallback(cell, url) {
        /* Remove blockquote if present */
        var bq = cell.querySelector(".instagram-media");
        if (bq) bq.remove();

        /* Hide skeleton */
        var skel = cell.querySelector(".ig-skeleton");
        if (skel) skel.classList.add("hidden");

        /* Build fallback */
        var fb = document.createElement("div");
        fb.className = "ig-fallback visible";
        fb.innerHTML = `
        <div class="ig-fallback-icon">📵</div>
        <h4>Post unavailable</h4>
        <p>This post could not be loaded. It may be private, deleted, or blocked by your browser.</p>
        <a href="${url}" target="_blank" rel="noopener">
          Open on Instagram ↗
        </a>
      `;
        cell.appendChild(fb);
      }

      /* ═══════════════════════════════════════════════
       HIDE SKELETONS
       Called after instgrm.Embeds.process() fires
    ═══════════════════════════════════════════════ */
      function hideSkeletons() {
        document.querySelectorAll(".ig-skeleton").forEach(function (s) {
          s.classList.add("hidden");
        });
      }

      /* ═══════════════════════════════════════════════
       CHECK FOR FAILED EMBEDS
       Instagram renders an <iframe> inside the bq
       when successful. If no iframe after timeout
       → show fallback.
    ═══════════════════════════════════════════════ */
      function checkFailedEmbeds() {
        document.querySelectorAll(".ig-cell").forEach(function (cell) {
          var bq = cell.querySelector(".instagram-media");
          if (!bq) return; // already showing fallback

          var hasIframe = bq.querySelector("iframe");
          if (!hasIframe) {
            var fallbackUrl = bq.dataset.fallbackUrl || "#";
            showFallback(cell, fallbackUrl);
          }
        });
      }

      /* ═══════════════════════════════════════════════
       LOAD INSTAGRAM EMBED SCRIPT (once)
    ═══════════════════════════════════════════════ */
      function loadEmbedScript(onReady) {
        if (document.getElementById("ig-embed-script")) {
          /* Already loaded — just process */
          onReady();
          return;
        }
        var s = document.createElement("script");
        s.id = "ig-embed-script";
        s.async = true;
        s.src = "https://www.instagram.com/embed.js";
        s.onload = onReady;
        s.onerror = function () {
          /* Script itself failed (network block, adblocker) */
          document.querySelectorAll(".ig-cell").forEach(function (cell) {
            var bq = cell.querySelector(".instagram-media");
            if (bq) showFallback(cell, bq.dataset.fallbackUrl || "#");
          });
        };
        document.body.appendChild(s);
      }

      /* ═══════════════════════════════════════════════
       MAIN INIT
    ═══════════════════════════════════════════════ */
      function initGrid(urls) {
        var grid = document.getElementById("igGrid");

        /* 1. Build & append all cells */
        urls.forEach(function (url, i) {
          grid.appendChild(buildCell(url, i));
        });

        /* 2. Load IG script → process embeds */
        loadEmbedScript(function () {
          if (window.instgrm && window.instgrm.Embeds) {
            window.instgrm.Embeds.process();
          }

          /* 3. After processing, hide skeletons */
          setTimeout(hideSkeletons, 1200);

          /* 4. After generous timeout, check for any
              embeds that silently failed */
          setTimeout(checkFailedEmbeds, 4000);
        });
      }

      /* ── Kick off ── */
      initGrid(IG_URLS);
    </script>
  </body>
</html>
