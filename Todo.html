<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 id="data"></h1>

    <button onclick="fetchdata()">CLick ME</button>

    <script>
      async function fetchdata() {
        let h1 = document.getElementById("data");
        let data;
        const resposne = await fetch("http://localhost:3000/api/todos");

        if (!resposne.ok) {
          console.error("APi Failed");
        }
        data = await resposne.json();

        h1.innerHTML = JSON.stringify(data);
      }
    </script>
  </body>
</html>
